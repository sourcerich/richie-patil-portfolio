faq:
  - question: "What do you mostly work on?"
    answer: "Full-stack web apps in React, Node.js and TypeScript, with Python where there’s data or ML involved. On the ML side I use scikit-learn, Pandas and LangChain. I deploy to AWS or Azure, keep data in MySQL or Snowflake, and ship with Docker and CI/CD."
  - question: "What kind of projects do you take on?"
    answer: "Full-stack platforms, applied ML, data pipelines and MLOps. Recent ones include a multi-tenant CRM, a RAG assistant for risk documents and a scraper that tracks 10,000 products a day."
  - question: "Startups or enterprises?"
    answer: "Both. I’ve worked on enterprise insurance systems and on small SaaS products, and I adjust how much process there is to fit the team."
  - question: "How do you like to work with a team?"
    answer: "In a mixed team, with decisions written down. I’ve also led a team of three through two projects running at the same time."

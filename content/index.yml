title: "Richie Patil – Full-stack & AI engineer"
seo:
  title: "Richie Patil – Full-stack & AI engineer"
  description: "Richie Patil builds backends, data pipelines and AI systems: APIs for SaaS products, ETL and MLOps, retrieval-augmented generation and machine-learning models."

# The hero.
name: "Richie Patil"
# The Marathi touch: the name in Devanagari.
nameMr: "रिची पाटील"
role: "Full-stack & AI engineer"
intro: "I build backends, data pipelines and AI systems for SaaS products, mostly the parts that have to keep working when traffic spikes."
available: "Available for work worldwide"

# Numbers along the bottom of the hero.
stats:
  - { value: "5", label: "SaaS products with my APIs behind them" }
  - { value: "45 s → 145 ms", label: "one endpoint, after finding its bottleneck" }
  - { value: "1M+", label: "certificates the Sankalp platform can hold" }
  - { value: "~85%", label: "accuracy forecasting sunspot activity" }

# What I do. `key` is what projects list under `skills`; `color` paints the
# skill's card and every project that lists it first.
skills:
  - key: "web"
    title: "Full-stack & APIs"
    color: "#dd5f2e"
    body: "React and TypeScript on the front, Node.js, Express and Sequelize behind it. I’ve built the APIs behind five SaaS products, including a multi-tenant CRM, and once took a 45-second endpoint down to 145 ms."
  - key: "data"
    title: "Data & MLOps"
    color: "#8e9a3e"
    body: "ETL jobs, scrapers and aggregation pipelines feeding Segment, Google Analytics and Power BI, shipped in Docker through CI."
  - key: "ai"
    title: "Generative AI"
    color: "#f2a531"
    body: "Retrieval over your own documents with LangChain and Llama 3 or GPT, running serverless on AWS Lambda."
  - key: "ml"
    title: "Machine learning"
    color: "#d98b76"
    body: "Supervised models with scikit-learn and Pandas. My dissertation forecast sunspot activity at about 85% accuracy."

contact:
  title: "Let’s build something"
  body: "If you’re building something and want another pair of hands on the backend or the machine-learning side, write to me. I’m happy to talk an idea through before there’s a spec."

faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my technical expertise and services.
  categories:
    - title: Technical Skills & Services
      questions:
        - label: What technologies do you specialize in?
          content: |
            I specialize in backend development using Node.js, TypeScript, and Python. My ML expertise includes scikit-learn, Pandas, NumPy, LangChain, and OpenAI API. I work with cloud platforms like AWS (Lambda, EC2, S3) and Azure, databases including MySQL and Snowflake, and DevOps tools like Docker and CI/CD pipelines.
        - label: What kind of projects do you work on?
          content: |
            I focus on backend API development, machine learning solutions, data pipeline engineering, and MLOps implementations. This includes building scalable SaaS applications, implementing RAG-based AI systems, developing ETL processes, and creating automated data aggregation pipelines for enterprise clients.
        - label: Do you work with startups and enterprises?
          content: |
            Yes! I have experience working with both startups and enterprise clients. I've handled production-critical systems for enterprise insurance applications and built scalable backend solutions for SaaS platforms managing high-volume supply chain operations.
    - title: Experience & Background
      questions:
        - label: What is your educational background?
          content: |
            I'm B.Tech graduate in Computer Science and Engineering (AI&ML) with a minor in Business Management from Amity University Mumbai. I obtained a CGPA of 7.93/10.00 and have completed certifications including the Google Data Analytics Professional Certificate.
        - label: What notable achievements do you have?
          content: |
            Some key achievements include reducing API response latency by 99.7% (from 45s to 145ms), improving client incident resolution by 17%, processing 500,000+ customer records for data insights, and securing Top 59 rank in the Analytics Olympiad 2023. I've also been selected for ISRO's START programme.
        - label: How do you approach problem-solving?
          content: |
            I combine analytical thinking with systematic engineering approaches. Whether it's optimizing API performance, implementing ML models, or designing data pipelines, I focus on scalability, efficiency, and reliability. I believe in thorough testing, comprehensive documentation, and continuous improvement.
    - title: Collaboration & Contact
      questions:
        - label: How do you handle project collaboration?
          content: |
            I work effectively in cross-functional teams and have experience leading dedicated development teams. I believe in clear communication, comprehensive documentation, and agile methodologies. I've successfully collaborated across multiple simultaneous projects while meeting tight deadlines.
        - label: What interests you most about your work?
          content: |
            I'm passionate about solving complex technical challenges through code and data. The intersection of backend engineering and machine learning fascinates me - building systems that not only scale efficiently but also provide intelligent insights. I love seeing how optimized APIs and ML solutions directly impact business outcomes.
        - label: How can someone get in touch with you?
          content: |
            You can reach me at richiepatilwork@gmail.com or connect with me on LinkedIn at linkedin.com/in/richiepatil. I'm always open to discussing interesting technical challenges and collaboration opportunities in backend development and ML engineering.

<!doctype html>
<html lang="mr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>शुभ दीपावली</title>
    <meta name="description" content="शुभ दीपावली. एक दिवा लावा आणि हजारो दिवे उजळतील.">
    <meta name="theme-color" content="#140a08">
    <meta property="og:type" content="website">
    <meta property="og:title" content="शुभ दीपावली">
    <meta property="og:description" content="शुभ दीपावली. एक दिवा लावा आणि हजारो दिवे उजळतील.">
    <meta property="og:url" content="https://diwali.richiepatil.com/">
    <link rel="canonical" href="https://diwali.richiepatil.com/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" as="font" type="font/woff2" href="/fonts/shantell-sans-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/kalam-700-devanagari.woff2" crossorigin>
    <link rel="stylesheet" href="/diwali.css">
    <script>document.documentElement.classList.add('js')</script>
  </head>
  <body>
    <!-- everything you see, the diyas, the toran, the sparks and the wish included, is drawn inside the scene -->
    <iframe id="flower-bg" class="flower-bg" src="/scene.html?diwali" title="" aria-hidden="true" tabindex="-1"></iframe>

    <main id="main" class="stage" data-stage="idle">
      <section class="hero">
        <h1 class="deva mr" id="title" aria-label="दिवा लावा">
          <span class="ch" data-engine-word data-single aria-hidden="true">दिवा</span>
          <span class="ch" data-engine-word data-single aria-hidden="true">लावा</span>
        </h1>
      </section>

      <section class="panel">
        <div class="wish-text" id="wishes-wrap" aria-hidden="true">
          <h2 class="sr-only" id="wishes-title" tabindex="-1">शुभ दीपावली</h2>
          <p class="sr-only">तुमचे घर प्रकाशाने आणि हास्याने उजळून निघो, आज आणि वर्षभर.</p>
        </div>
      </section>
    </main>

    <!-- an invisible button over the big diya in the scene, for keyboards and screen readers -->
    <button class="lead-hit" type="button" id="lead" aria-label="दिवा लावा" hidden></button>

    <p class="sr-only" id="announce" role="status" aria-live="polite"></p>

    <script type="module" src="/diwali.js"></script>
  </body>
</html>

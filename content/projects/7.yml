summary: "A stock app for Indian investors that gives calm advice and shows the reasoning behind every call. No trading, just guidance."
problem: "Most investing apps push you to trade fast. 72 Street wanted the opposite: calm, clear advice from real advisors, with no trading or order placing in the app."
build: "A phone and tablet app with one-time-password login. Each advisor recommendation shows an entry range, a target, a stop-loss and the risk against the reward. It also has live market data, watchlists and subscription plans, and it asks for consent first, follows India’s data-protection law and avoids tricks that push you to buy."
outcome: "Live on Google Play with a 4.9 rating from early users and 500+ downloads."

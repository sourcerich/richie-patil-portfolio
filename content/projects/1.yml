summary: "A certificate system for a whole NGO: issue, store and check certificates, with room for over a million."
problem: "The Sankalp Organisation needed one dependable place to issue, store and check certificates and member records, because doing it by hand couldn’t keep up."
build: "I built the site with React and TypeScript, with Node.js and a SQL database behind it, on a Linux server. Private data is encrypted from login to storage, and security checks run every time we publish an update."
outcome: "It has room for more than a million certificates, and the Sankalp team uses it every day."

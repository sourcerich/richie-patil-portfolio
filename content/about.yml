profile: "I’m Richie Vidyadhar Patil, a full-stack developer in Mumbai. I studied Computer Science at Amity University Mumbai, specialising in AI and machine learning, with a minor in Business Management. The minor turned out to matter more than I expected, because most of the hard calls in a system are business calls first."


beyond: "Strategy games, long-distance running, the kitchen and the trail. Each sharpens something the work depends on: foresight, endurance and the art of improvisation."

faq:
  - question: "What is your area of focus?"
    answer: "Software systems in Node.js, TypeScript and Python; machine learning with scikit-learn, Pandas and LangChain; cloud infrastructure on AWS and Azure; data on MySQL and Snowflake; and delivery through Docker and CI/CD."
  - question: "Which engagements do you take on?"
    answer: "Backend platforms, applied machine learning, data pipelines and MLOps, from scalable SaaS and retrieval-augmented AI to ETL and automated data aggregation."
  - question: "Startups or enterprises?"
    answer: "Both. My work spans enterprise insurance systems and high-volume supply-chain SaaS, and I shape the process to the scale of the organisation."
  - question: "How do you prefer to collaborate?"
    answer: "Within cross-functional teams, with clear communication and thorough written documentation. I have also led small development teams to delivery against demanding timelines."

headline:
  - "I like to know"
  - "what a system is for"
  - "before I build it."

paragraphs:
  - "I’m Richie Vidyadhar Patil, a full-stack developer in Mumbai. I studied Computer Science at Amity University Mumbai, specialising in AI and machine learning, with a minor in Business Management. The minor turned out to matter more than I expected, because most of the hard calls in a system are business calls first."
  - "When I pick something up, I start by asking what it’s for: what the business needs from it, how fast it has to be, and who will use it. Then I build in small steps in React, Node.js, TypeScript or Python, and test more than feels necessary."
  - "The part I enjoy most is taking a messy set of requirements and ending up with something small and a bit boring that keeps working when traffic spikes."


summary: "GrowthPipe, a CRM that keeps every lead and call in one place, plus the site that feeds it: one partner for the software and the leads."
problem: "Leads came in from Meta and Google ads, WhatsApp and landing pages, and callers lost track of who to call back and what had already happened."
build: "A CRM built for many companies at once, where a caller’s whole day is one screen: callbacks first, tap to call, log the result, move on. Each company’s data is kept apart inside the database, so nobody can see another’s by mistake, and every enquiry from the landing pages arrives automatically."
outcome: "Tavco’s own team ran on it every day before anyone else bought it, and it is now the product at the centre of Tavco Growth."

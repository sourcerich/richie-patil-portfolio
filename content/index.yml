title: "Richie Patil – Developer & Creative Solutions Architect"
description: "Richie Patil is a full-stack developer in Mumbai. He builds web apps and APIs in React, Node.js and TypeScript, and machine-learning systems in Python."
seo:
  title: "Richie Patil – Developer & Creative Solutions Architect"
  description: "Richie Patil is a full-stack developer in Mumbai. He builds web apps and APIs in React, Node.js and TypeScript, and machine-learning systems in Python."

hero:
  role: "Developer & Creative Solutions Architect"
  location: "Mumbai"
  status: "Available for work"
  lead: "I build full-stack web apps in React, Node.js and TypeScript, and machine-learning code in Python. Most of my week goes to APIs and data pipelines for SaaS products."
  stack:
    - "Python · TypeScript · Node.js · React"
    - "AWS · Docker · PostgreSQL · Git"

intro:
  lead: "I’m Richie, a full-stack developer in Mumbai. I spend most of my time on the backend, and the rest on getting machine learning to work outside a notebook."
  body: "Day to day that means React on the front, Node.js and TypeScript services behind it, Python for ML and LLM work, and AWS or Azure underneath. So far that has covered supply-chain SaaS, a fintech app, a CRM and enterprise insurance systems."
  quote: "I want to know what a system is for before I worry about how fast it is."
  beyond: "Outside work: strategy games, running around Mumbai, and cooking at home."

work:
  heading: "Things I’ve built since 2022."
  note: "72Street, TavcoGrowth and Sankalp are live. The rest are client work, coursework or retired."
  span: "2022 – 2026"

services:
  heading: "Full-stack, with a backend bias. Some machine learning."
  body: "I build both ends, though the backend is where I spend most of my time. The ML and data work usually comes attached to it: a model needs an API before anyone can use it, and a pipeline needs somewhere to land."
  items:
    - title: "Full-stack & APIs"
      body: "React and TypeScript on the front, Node.js, Express and Sequelize behind it. I’ve built the APIs behind five SaaS products, including a multi-tenant CRM, and once took a 45-second endpoint down to 145 ms."
      image: "/content/projects/sankalp.png"
    - title: "Data pipelines & MLOps"
      body: "ETL jobs, scrapers and aggregation pipelines feeding Segment, Google Analytics and Power BI, shipped in Docker through CI."
      image: "/content/projects/scraper.webp"
    - title: "Generative AI & RAG"
      body: "Retrieval over your own documents with LangChain and Llama 3 or GPT, running serverless on AWS Lambda."
      image: "/content/projects/rag.webp"
    - title: "Machine learning"
      body: "Supervised models with scikit-learn and Pandas. My dissertation forecast sunspot activity at about 85% accuracy."
      image: "/content/projects/sunspots.jpg"


profile: "I’m Richie Vidyadhar Patil, a full-stack developer in Mumbai. I lead backend work for SaaS products. I studied Computer Science (AI and machine learning) at Amity University Mumbai, with a minor in Business Management, so I make technical calls with your business in mind."

approach:
  title: "How we’d work"
  subtitle: "What you can expect"
  items:
    - title: "Start with your goal"
      body: "Before I write any code, I ask what you need it to do, how fast it has to be and who will use it, because that stops you paying for things nobody needs."
    - title: "Small steps"
      body: "I build in small, tested steps, so you see progress early and problems show up while they’re still cheap to fix."
    - title: "Simple on purpose"
      body: "I turn messy requirements into something small and dependable that keeps working when traffic spikes."

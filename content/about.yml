  title: "About – Richie Patil"
  description: "Richie Patil is a developer and creative solutions architect in Mumbai, designing systems in Node.js, TypeScript and Python that hold steady under load."

headline:
  - "I begin with the why,"
  - "then build systems"
  - "that hold under load."

paragraphs:
  - "I’m Richie Vidyadhar Patil, a developer and creative solutions architect based in Mumbai. I read Computer Science, specialising in Artificial Intelligence and Machine Learning, with a minor in Business Management, at Amity University Mumbai. It was there that systems architecture and machine learning became a discipline, and there that I came to believe the finest solutions are shaped as much by business context as by code."
  - "My practice rests on two principles: efficiency and scale. Every engagement begins with the why: the commercial objective, the performance it must meet and the expectations of the people who will rely on it. From there I build iteratively in Node.js, TypeScript and Python, and test with rigour, so that what ships feels effortless and stays dependable."
  - "What moves me is distilling complex requirements into systems that are simple, considered and quietly resilient, and then watching them hold steady under pressure."


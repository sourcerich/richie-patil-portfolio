approach:
  title: "Approach"
  subtitle: "How I like to work"
  items:
    - title: "Ask what it’s for"
      body: "When I pick something up, I start by asking what it’s for: what the business needs from it, how fast it has to be, and who will use it."
    - title: "Small steps"
      body: "I build in small steps in React, Node.js, TypeScript or Python, and test more than feels necessary."
    - title: "Keep it boring"
      body: "The part I enjoy most is taking a messy set of requirements and ending up with something small and a bit boring that keeps working when traffic spikes."

